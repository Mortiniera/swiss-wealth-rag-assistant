services:
  postgres:
    image: postgres:16-alpine
    container_name: swiss-wealth-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-helvetia}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-helvetia}
      POSTGRES_DB: ${POSTGRES_DB:-helvetia_bank}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-helvetia} -d ${POSTGRES_DB:-helvetia_bank}"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
