services:
  postgres:
    image: postgres:16-alpine
    container_name: swiss-wealth-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-helvetia}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-helvetia}
      POSTGRES_DB: ${POSTGRES_DB:-helvetia_bank}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-helvetia} -d ${POSTGRES_DB:-helvetia_bank}"]
      interval: 5s
      timeout: 5s
      retries: 10

  pgadmin:
    image: dpage/pgadmin4:8
    container_name: swiss-wealth-pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_DEFAULT_EMAIL:-admin@example.com}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_DEFAULT_PASSWORD:-admin}
      PGADMIN_CONFIG_SERVER_MODE: "False"
    ports:
      - "${PGADMIN_PORT:-5050}:80"
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - pgadmin_data:/var/lib/pgadmin

volumes:
  postgres_data:
  pgadmin_data:
