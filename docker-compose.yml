services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: swiss-wealth-api
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-helvetia}:${POSTGRES_PASSWORD:-helvetia}@postgres:5432/${POSTGRES_DB:-helvetia_bank}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      LANGFUSE_PUBLIC_KEY: ${LANGFUSE_PUBLIC_KEY:-}
      LANGFUSE_SECRET_KEY: ${LANGFUSE_SECRET_KEY:-}
      LANGFUSE_BASE_URL: ${LANGFUSE_BASE_URL:-}
    ports:
      - "${API_PORT:-8000}:8000"
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: swiss-wealth-frontend
    environment:
      # Browser calls the API on the host, not the Compose DNS name.
      VITE_API_URL: http://localhost:${API_PORT:-8000}
    ports:
      - "${FRONTEND_PORT:-5173}:5173"
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
    depends_on:
      - api

  postgres:
    image: pgvector/pgvector:pg16
    container_name: swiss-wealth-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-helvetia}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-helvetia}
      POSTGRES_DB: ${POSTGRES_DB:-helvetia_bank}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-helvetia} -d ${POSTGRES_DB:-helvetia_bank}" ]
      interval: 5s
      timeout: 5s
      retries: 10

  pgadmin:
    image: dpage/pgadmin4:8
    container_name: swiss-wealth-pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_DEFAULT_EMAIL:-admin@example.com}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_DEFAULT_PASSWORD:-admin}
      PGADMIN_CONFIG_SERVER_MODE: "False"
    ports:
      - "${PGADMIN_PORT:-5050}:80"
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - pgadmin_data:/var/lib/pgadmin

  # One-shot QA: docker compose --profile test run --rm test
  test:
    profiles: ["test"]
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-helvetia}:${POSTGRES_PASSWORD:-helvetia}@postgres:5432/${POSTGRES_DB:-helvetia_bank}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
    depends_on:
      postgres:
        condition: service_healthy
    command: ["pytest", "-q"]
    restart: "no"

  # One-shot eval (needs ingested policies + running API for ask suite):
  #   docker compose up -d api postgres
  #   docker compose exec api python scripts/ingest_policies.py
  #   docker compose --profile eval run --rm eval
  eval:
    profiles: ["eval"]
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-helvetia}:${POSTGRES_PASSWORD:-helvetia}@postgres:5432/${POSTGRES_DB:-helvetia_bank}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      EVAL_BASE_URL: http://api:8000
      EVAL_SUITES: ${EVAL_SUITES:-retrieval,ask}
    depends_on:
      api:
        condition: service_started
      postgres:
        condition: service_healthy
    command: ["python", "eval/run_eval.py"]
    restart: "no"

volumes:
  postgres_data:
  pgadmin_data:
  frontend_node_modules:
